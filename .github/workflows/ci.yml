name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lab:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Make scripts executable
        run: chmod +x ./scripts/*.sh

      - name: Start the lab
        run: ./scripts/up.sh

      - name: Build the samples
        run: dotnet build DonHang.slnx --warnaserror

      - name: Test the samples
        run: dotnet test DonHang.slnx --no-build

      - name: Run every lesson script and capture its output
        shell: bash
        run: ./scripts/capture-output.sh --all 2>&1 | tee "$RUNNER_TEMP/capture.log"

      - name: Fail if any captured output changed
        shell: bash
        run: git diff -- outputs/ | tee "$RUNNER_TEMP/drift.log"; git diff --exit-code -- outputs/

      - name: Say what went wrong
        if: failure()
        shell: bash
        run: |
          detail=$(tail -n 40 "$RUNNER_TEMP"/*.log 2>/dev/null | sed 's/%/%25/g; s/\r//g')
          echo "::error title=ci failed::${detail//$'\n'/%0A}"
          docker compose logs --tail 100

      - name: Stop the lab
        if: always()
        run: ./scripts/down.sh
