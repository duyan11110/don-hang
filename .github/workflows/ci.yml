name: ci

on:
  push:
    # A Dependabot branch always has its pull request, which runs ci.yml
    # already; running it for the push as well would only do it twice.
    branches-ignore: ['dependabot/**']
  pull_request:
  workflow_dispatch:

jobs:
  # lesson: devops.l2.quality-gate
  # The checks every change must pass. `dotnet test` also runs the integration
  # tests: Testcontainers starts PostgreSQL and Redis on the Docker engine the
  # GitHub-hosted Ubuntu runner already has, so this job needs no lab.
  test:
    runs-on: ubuntu-24.04
    steps:
      # lesson: devops.l3.pinning-by-content
      # From stage-3 every uses: in Đơn Hàng's workflows names a full commit
      # id, with the version it had when pinned in the comment: a tag such as
      # v4 is a Git tag its owner can move to other code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      # lesson: devops.l2.dependency-cache
      # The key changes exactly when a locked package changes. With no exact
      # match, the newest cache whose key starts with the restore-keys prefix
      # is restored, and dotnet restore downloads only what is still missing.
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # lesson: devops.l3.pinning-by-content
      # Locked mode restores exactly what each project's packages.lock.json
      # names and fails if a project asks for anything else, so a change to
      # the packages arrives as a reviewed change to a lock file. NuGet's
      # warnings about known vulnerabilities still fail the build below.
      - name: Restore the packages the lock files name
        run: dotnet restore DonHang.slnx --locked-mode

      - name: Build the solution
        run: dotnet build DonHang.slnx --no-restore --warnaserror

      - name: Test the solution
        run: dotnet test DonHang.slnx --no-build

  app:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: DonHang.App
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.x

      # lesson: devops.l3.pinning-by-content
      # pubspec.lock already records each package's version and sha256;
      # --enforce-lockfile fails instead of resolving anything it does not name.
      - name: Get the packages pubspec.lock names
        run: flutter pub get --enforce-lockfile

      - name: Analyze DonHang.App
        run: flutter analyze

      # lesson: frontend.l3.golden-tests
      # On this Linux runner the golden tests run too; on failure the images
      # that did not match, and their differences, are kept as an artifact.
      - name: Test DonHang.App
        run: flutter test

      - name: Keep the golden test failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: golden-failures
          path: DonHang.App/test/**/failures/
          if-no-files-found: ignore

  # lesson: devops.l2.building-images-in-ci
  # Built once per run, from the Dockerfiles the lab uses, under the names
  # docker-compose.yml gives the services. Later jobs run these exact images;
  # none of them builds again.
  image:
    needs: test
    runs-on: ubuntu-24.04
    env:
      IMAGES: >-
        donhang-api:stage-2 donhang-migrate:stage-2
        donhang-notifications:stage-3 donhang-notifications-migrate:stage-3
        donhang-payments:stage-3 donhang-payments-migrate:stage-3
        donhang-fake-gateway:stage-3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build the images
        run: |
          docker build --file DonHang.Api/Dockerfile --tag donhang-api:stage-2 .
          docker build --file DonHang.Api/Dockerfile --target migrate --tag donhang-migrate:stage-2 .
          docker build --file DonHang.Notifications/Dockerfile --tag donhang-notifications:stage-3 .
          docker build --file DonHang.Notifications/Dockerfile --target migrate --tag donhang-notifications-migrate:stage-3 .
          docker build --file DonHang.Payments/Dockerfile --tag donhang-payments:stage-3 .
          docker build --file DonHang.Payments/Dockerfile --target migrate --tag donhang-payments-migrate:stage-3 .
          docker build --file fake-gateway/Dockerfile --tag donhang-fake-gateway:stage-3 .

      # lesson: devops.l3.software-bill-of-materials
      # One SBOM per image, made by Syft from the image this job just built,
      # so it lists what will run, not what the project files declare. The
      # SBOMs are kept as an artifact of the run, and publish attests them.
      - name: Write an SBOM of each image
        run: |
          for image in $IMAGES; do
            scripts/devops/sbom.sh "$image"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sboms
          path: sbom/*.cdx.json

      # lesson: devops.l3.vulnerability-scanning
      # Grype scans each SBOM, and this step fails on a High or Critical
      # vulnerability that has a fixed version (.grype.yaml lists the ones
      # accepted, each with its reason). A failure stops the run before the
      # images are saved, so no later job can deploy or push them.
      - name: Scan each SBOM for known vulnerabilities
        run: |
          for sbom in sbom/*.cdx.json; do
            scripts/devops/scan-image.sh "$sbom"
          done

      # lesson: devops.l2.workflow-artifacts
      # This runner, and the images on it, are gone when the job ends. The
      # images leave as one file, an artifact of this run, for later jobs.
      - name: Save the images to one file
        run: docker save --output images.tar $IMAGES

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: images
          path: images.tar

  # lesson: devops.l2.deployment-environments
  # Every green push to master is delivered to staging: a throwaway copy of
  # Đơn Hàng's services, started on this job's own runner from the images
  # the image job built, checked with one request, then removed.
  staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, image]
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: images

      - name: Load the images
        run: docker load --input images.tar

      # The lab box is the one image built here: Caddy (web) shares its
      # network, and it holds tools, not Đơn Hàng's code.
      - name: Create the fake dev secrets and build the lab box
        run: |
          ./scripts/dev-secrets.sh
          docker compose build lab

      # lesson: devops.l2.migrations-in-the-pipeline
      # migrate runs the migration bundle and exits; api starts only after it
      # exits successfully, so a failing migration makes `up` fail and stops
      # this job before any api runs on that database. --no-build: api and
      # migrate run the images just loaded.
      - name: Start staging
        run: docker compose up --detach --no-build --wait web api

      - name: Ask for the products through Caddy
        run: curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/api/v1/products

      - name: Show the logs if staging failed
        if: failure()
        run: docker compose logs --tail 100

      - name: Remove staging
        if: always()
        run: docker compose down --volumes --remove-orphans

  # lesson: devops.l2.pushing-images-from-ci
  # Only master's green commits reach the registry. The job logs in with the
  # GITHUB_TOKEN GitHub creates for this run, which may push packages only
  # because `permissions:` says so. It pushes the images the tests passed
  # with: loaded from the artifact, never rebuilt. From stage-3 it runs once
  # per image; fake-gateway, the lab's stand-in for a payment gateway, is
  # never pushed.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, image]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image:
          - donhang-api:stage-2
          - donhang-migrate:stage-2
          - donhang-notifications:stage-3
          - donhang-notifications-migrate:stage-3
          - donhang-payments:stage-3
          - donhang-payments-migrate:stage-3
    # lesson: devops.l3.build-provenance
    # id-token: write lets a step ask GitHub for an ID token that names this
    # workflow run; attestations: write lets it store attestations.
    permissions:
      packages: write
      id-token: write
      attestations: write
    env:
      LOCAL: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: images

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sboms
          path: sbom

      - name: Load the images
        run: docker load --input images.tar

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # lesson: devops.l2.tagging-images-by-commit
      # sha- and the full id of the commit that was pushed, 40 characters:
      # every image in the registry leads back to the code that built it.
      # docker tag only adds a name to the loaded image; it builds nothing.
      # Never `latest`: a deployment always names the commit it runs.
      - name: Tag the image with this commit and push it
        id: push
        run: |
          name="ghcr.io/duyan11110/${LOCAL%%:*}"
          docker tag "$LOCAL" "$name:sha-$GITHUB_SHA"
          docker push "$name:sha-$GITHUB_SHA"
          digest=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$name:sha-$GITHUB_SHA" \
            | grep "^$name@" | cut -d@ -f2)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "sbom=sbom/${LOCAL%%:*}.cdx.json" >> "$GITHUB_OUTPUT"
          echo "pushed $name@$digest"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # lesson: devops.l3.signing-images
      # Keyless: cosign trades this job's GitHub ID token for a short-lived
      # certificate that names ci.yml on this branch, signs the digest (never
      # a tag), records the signature in the public transparency log and
      # discards the private key. The signature is stored beside the image.
      - name: Sign the pushed digest
        env:
          IMAGE: ${{ steps.push.outputs.name }}@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

      # lesson: devops.l3.build-provenance
      # Provenance for the same digest: the repository, commit, workflow and
      # event that built it, signed through the same ID token and pushed to
      # the registry beside the image. Then the image job's SBOM of this
      # image, attested the same way.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: ${{ steps.push.outputs.sbom }}
          push-to-registry: true
          create-storage-record: false

  # The Kubernetes manifests under deploy/k8s/ (lessons/ and migrate/ too)
  # must be valid objects of the Kubernetes version the course teaches, with
  # no unknown field. kind-config.yaml configures kind, not Kubernetes. From
  # stage-3 the same holds for the config repository's environments, for
  # each Kustomize overlay as rendered, and for each Helm chart as rendered.
  manifests:
    runs-on: ubuntu-24.04
    env:
      KUBECONFORM: ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # From stage-3 deploy/k8s also holds objects of kinds that are not
      # Kubernetes's own: MetalLB's (schemas from the CRDs catalog, at a
      # pinned commit) and the lessons' BackupPolicy (its schema taken from
      # its CRD here). kubeconform has no schema for a CRD itself: the API
      # server checks it when scripts/k8s/custom-resources.sh applies it.
      # The kind cluster configs and Helm values are not Kubernetes objects.
      - name: Validate the Kubernetes manifests with kubeconform
        env:
          CRDS_CATALOG: https://raw.githubusercontent.com/datreeio/CRDs-catalog/fd90051867733c60d32d16450556e9cd18459aef
        run: |
          mkdir -p "$RUNNER_TEMP/schemas"
          yq -o=json '.spec.versions[0].schema.openAPIV3Schema' deploy/k8s/lessons/backup-policy-crd.yaml \
            > "$RUNNER_TEMP/schemas/backuppolicy_v1alpha1.json"
          docker run --rm --volume "$PWD/deploy/k8s:/k8s:ro" --volume "$RUNNER_TEMP/schemas:/schemas:ro" "$KUBECONFORM" \
            -strict -summary -kubernetes-version 1.34.0 \
            -schema-location default \
            -schema-location '/schemas/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -schema-location "$CRDS_CATALOG/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
            -skip CustomResourceDefinition \
            -ignore-filename-pattern 'kind-.*config[.]yaml' -ignore-filename-pattern 'values[.]yaml$' /k8s

      - name: Validate the config repository's environments
        if: hashFiles('deploy/gitops/config-repo/envs/**') != ''
        run: |
          docker run --rm --volume "$PWD/deploy/gitops/config-repo/envs:/envs:ro" "$KUBECONFORM" \
            -strict -summary -kubernetes-version 1.34.0 /envs

      # lesson: k8s.l2.config-repo-overlays
      # A mistake in the base or in a patch shows only in the rendered
      # manifests, so every overlay is rendered and the output validated.
      # The SealedSecrets an overlay lists exist only in the config
      # repository: here they are empty stand-ins.
      - name: Render each Kustomize overlay and validate it
        if: hashFiles('deploy/gitops/config-repo-kustomize/envs/*/kustomization.yaml') != ''
        run: |
          for overlay in deploy/gitops/config-repo-kustomize/envs/*/; do
            for name in $(grep -o 'sealed-[a-z-]*[.]yaml' "$overlay/kustomization.yaml"); do
              [ -f "$overlay/$name" ] || : > "$overlay/$name"
            done
            echo "== $overlay"
            kubectl kustomize "$overlay" | docker run --rm -i "$KUBECONFORM" \
              -strict -summary -kubernetes-version 1.34.0 -
          done

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: hashFiles('deploy/helm/**/Chart.yaml') != ''
        with:
          version: v3.19.5

      # Templates are text, not YAML: helm lint checks a chart, and only the
      # rendered output shows whether its manifests are valid objects.
      - name: Lint each Helm chart, render it and validate the output
        if: hashFiles('deploy/helm/**/Chart.yaml') != ''
        run: |
          for chart in $(find deploy/helm -name Chart.yaml -exec dirname {} \; | sort); do
            echo "== $chart"
            helm lint "$chart"
            helm template "$chart" | docker run --rm -i "$KUBECONFORM" \
              -strict -summary -kubernetes-version 1.34.0 -
          done

  # lesson: devops.l3.opentofu-resources
  # Every OpenTofu configuration under deploy/tofu must be formatted and
  # valid. validate checks syntax and references without contacting the
  # systems a configuration describes; init -backend=false downloads the
  # providers .terraform.lock.hcl names and leaves the state backend alone.
  iac:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Say if there is nothing to check yet
        if: hashFiles('deploy/tofu/**/*.tf') == ''
        run: echo "no OpenTofu configuration under deploy/tofu"

      - if: hashFiles('deploy/tofu/**/*.tf') != ''
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.10.10
          tofu_wrapper: false

      # The platform layers read the sealing key pair from secrets/.
      - name: Create the fake dev secrets
        if: hashFiles('deploy/tofu/**/*.tf') != ''
        run: ./scripts/dev-secrets.sh

      - name: Check the format of every configuration
        if: hashFiles('deploy/tofu/**/*.tf') != ''
        run: tofu fmt -check -recursive deploy/tofu

      - name: Validate every configuration
        if: hashFiles('deploy/tofu/**/*.tf') != ''
        run: |
          for dir in $(find deploy/tofu -name '*.tf' ! -path '*/modules/*' -exec dirname {} \; | sort -u); do
            echo "== $dir"
            tofu -chdir="$dir" init -backend=false -input=false >/dev/null
            tofu -chdir="$dir" validate
          done

  # Runs the scripts of the k8s track, in the order of the lessons, on a kind
  # cluster created on this runner, and fails when an output differs from the
  # one committed under outputs/stage-3/scripts/k8s/. The cluster pulls the
  # api and migrate images from GitHub Container Registry, by the tags in the
  # manifests (a sha- tag and 1.0.0), as a learner's cluster does.
  k8s:
    needs: manifests
    runs-on: ubuntu-24.04
    # A Pod stuck on an image it cannot pull makes a rollout wait forever;
    # the whole track takes well under this.
    timeout-minutes: 60
    env:
      TAG: stage-3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install kind and kubectl
        run: |
          curl -fsSL --output kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          curl -fsSL --output kubectl https://dl.k8s.io/release/v1.34.3/bin/linux/amd64/kubectl
          sha256sum --check --strict <<'SUMS'
          aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind
          ab60ca5f0fd60c1eb81b52909e67060e3ba0bd27e55a8ac147cbc2172ff14212  kubectl
          SUMS
          sudo install kind kubectl /usr/local/bin/
          kind version
          kubectl version --client

      - name: Make scripts executable
        run: chmod +x ./scripts/*.sh ./scripts/*/*.sh

      # scripts/k8s/deploy.sh builds the Secrets from .env.
      - name: Create the fake dev secrets
        run: ./scripts/dev-secrets.sh

      - name: Run every k8s script and capture its output
        shell: bash
        run: ./scripts/capture-output.sh --k8s 2>&1 | tee "$RUNNER_TEMP/capture.log"

      - name: Fail if any captured output changed
        shell: bash
        run: |
          git add --intent-to-add outputs/
          git diff -- outputs/ | tee "$RUNNER_TEMP/drift.log"
          git diff --exit-code -- outputs/

      - name: Say what went wrong
        if: failure()
        shell: bash
        run: |
          detail=$(tail -n 40 "$RUNNER_TEMP"/*.log 2>/dev/null | sed 's/%/%25/g; s/\r//g')
          echo "::error title=k8s failed::${detail//$'\n'/%0A}"
          kubectl get pods --all-namespaces || true
          kubectl get events -n donhang || true

      - name: Keep the captured outputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: k8s-outputs
          path: outputs/stage-3/scripts/k8s/

      - name: Delete the cluster
        if: always()
        run: ./scripts/k8s/cluster-down.sh

  # Runs every lesson script against the lab and fails when an output differs
  # from the one committed under outputs/stage-3/. The k8s track's scripts
  # run in the k8s job above instead; the scripts that drive OpenTofu, Argo CD
  # and kind clusters from the host, verify-image.sh and change-hotspots.sh
  # are captured on a learner's machine (see STAGE.md).
  lab:
    runs-on: ubuntu-24.04
    env:
      TAG: stage-3
      # The scripts in scripts/devops/ need Prometheus, Grafana, Loki and
      # Alloy, which Compose starts only with the monitoring profile.
      COMPOSE_PROFILES: monitoring
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Some scripts run on the runner itself and need dotnet or Flutter.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.x

      - name: Make scripts executable
        run: chmod +x ./scripts/*.sh ./scripts/*/*.sh

      - name: Start the lab
        run: ./scripts/up.sh

      - name: Run every lesson script and capture its output
        shell: bash
        run: ./scripts/capture-output.sh --all 2>&1 | tee "$RUNNER_TEMP/capture.log"

      - name: Fail if any captured output changed
        shell: bash
        # --intent-to-add: an output with no committed copy yet counts too.
        run: |
          git add --intent-to-add outputs/
          git diff -- outputs/ | tee "$RUNNER_TEMP/drift.log"
          git diff --exit-code -- outputs/

      - name: Say what went wrong
        if: failure()
        shell: bash
        run: |
          detail=$(tail -n 40 "$RUNNER_TEMP"/*.log 2>/dev/null | sed 's/%/%25/g; s/\r//g')
          echo "::error title=ci failed::${detail//$'\n'/%0A}"
          docker compose logs --tail 100

      # The outputs as this run wrote them, to compare or to take as they are.
      - name: Keep the captured outputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lab-outputs
          path: outputs/

      - name: Stop the lab
        if: always()
        run: ./scripts/down.sh
