name: release

# lesson: devops.l2.cutting-a-release
# Runs when a version tag such as v1.0.0 is pushed. It builds nothing: the
# images ci.yml pushed for the tagged commit get the version as a second
# tag, and that version's section of CHANGELOG.md becomes the release notes.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the GitHub release
  packages: write # push the version tag to ghcr.io

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before anything is pushed: a version with no CHANGELOG.md section
      # stops here.
      - name: Read this version's notes from CHANGELOG.md
        run: ./scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # lesson: devops.l2.cutting-a-release
      # Pull the images ci.yml pushed when this commit reached master. A commit
      # that never went through master has no sha- images: docker pull fails,
      # and so does the release. Tag v1.0.0 gives the images the tag 1.0.0.
      - name: Promote the tested images to this version
        run: |
          commit=$(git rev-parse HEAD)
          version="${GITHUB_REF_NAME#v}"
          for image in donhang-api donhang-migrate donhang-notifications                        donhang-notifications-migrate donhang-payments donhang-payments-migrate; do
            name="ghcr.io/duyan11110/$image"
            docker pull "$name:sha-$commit"
            docker tag "$name:sha-$commit" "$name:$version"
            docker push "$name:$version"
          done

      # lesson: devops.l3.signing-images
      # Signatures and attestations belong to a digest, not to a tag. The
      # version tag must name the very digest ci.yml signed and attested
      # under sha-; then the release carries them without signing again.
      - name: Check that each version tag names the signed digest
        run: |
          commit=$(git rev-parse HEAD)
          version="${GITHUB_REF_NAME#v}"
          digest_of() { docker buildx imagetools inspect "$1" | sed -n 's/^Digest: *//p'; }
          for image in donhang-api donhang-migrate donhang-notifications                        donhang-notifications-migrate donhang-payments donhang-payments-migrate; do
            name="ghcr.io/duyan11110/$image"
            signed=$(digest_of "$name:sha-$commit")
            released=$(digest_of "$name:$version")
            echo "$image: sha-$commit $signed, $version $released"
            [ "$signed" = "$released" ] || { echo "::error::$image:$version is not the digest CI signed"; exit 1; }
          done

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
