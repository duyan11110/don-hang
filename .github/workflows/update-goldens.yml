name: update-goldens

# lesson: frontend.l3.golden-tests
# Run by hand (Actions → update-goldens → Run workflow) after a change that
# is meant to look different. It writes DonHang.App's golden images on the
# same Linux runner the ci workflow compares them on, and uploads them as an
# artifact of this run. It commits nothing: whoever accepts the new look
# adds the images to a pull request, where they are reviewed as images.
on:
  workflow_dispatch:

jobs:
  goldens:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: DonHang.App
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.x

      - name: Write the golden images
        run: flutter test --tags golden --update-goldens

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goldens
          path: DonHang.App/test/design/goldens/
