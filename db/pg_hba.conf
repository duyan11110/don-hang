# Who may connect to the db service, and how they prove who they are. The
# server reads this file, not the pg_hba.conf that initdb wrote inside the
# db-data volume (docker-compose.yml points hba_file here), so a change here
# needs only `docker compose restart db`, never a new volume.
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD
# Inside the db container itself: no password, as the image sets it up.
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
# lesson: backend.l3.read-replicas
# "replication" is not a database: it is the WAL stream that db-replica and
# pg_basebackup ask for, which "all" in the last line does not cover.
host    replication     donhang         172.28.0.0/24           scram-sha-256
# Everyone else, over the network, with a password.
host    all             all             all                     scram-sha-256
