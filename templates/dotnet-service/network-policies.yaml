# lesson: devops.l4.golden-path
# Closed by default, both ways. Ingress: no rule, so nothing may call the
# service until the team adds who does (the Gateway, another service).
# Egress: DNS comes from the namespace's dns-egress policy; the service and
# its migration may reach PostgreSQL, and nothing else until added.
# PostgreSQL's own policy (base/network-policies.yaml) must name them too.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: __SERVICE__
  namespace: donhang
spec:
  podSelector:
    matchLabels:
      app: __SERVICE__
  policyTypes: ["Ingress"]
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: __SERVICE__-egress
  namespace: donhang
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [__SERVICE__, __SERVICE__-migrate]
  policyTypes: ["Egress"]
  egress:
    - to: [{ podSelector: { matchLabels: { app: db } } }]
      ports: [{ port: 5432 }]
