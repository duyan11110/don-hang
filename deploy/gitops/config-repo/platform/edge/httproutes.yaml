# lesson: k8s.l2.gateway-api
# The routes the Đơn Hàng team owns, attached to the Gateway donhang through
# parentRefs: the paths Caddy sends to the api in Compose, on the host
# donhang.localhost, go to port 8080 of the Service api.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: donhang
spec:
  parentRefs:
    - name: donhang
      sectionName: https
  hostnames:
    - donhang.localhost
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
        - path:
            type: PathPrefix
            value: /api/v2
        - path:
            type: PathPrefix
            value: /openapi
      backendRefs:
        - name: api
          port: 8080
    # lesson: k8s.l2.staging-keeps-its-data
    # Payments answers /api/v1/refunds, as Caddy routes it in Compose: the
    # longer path wins over /api/v1, and the api never sees these requests.
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/refunds
      backendRefs:
        - name: payments
          port: 8080
---
# Keycloak by its own host: auth.donhang.localhost, every path.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: donhang
spec:
  parentRefs:
    - name: donhang
      sectionName: https
  hostnames:
    - auth.donhang.localhost
  rules:
    - backendRefs:
        - name: keycloak
          port: 8080
