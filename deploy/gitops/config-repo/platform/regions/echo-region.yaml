# lesson: k8s.l4.one-argo-cd-many-clusters
# What every region runs: Caddy answering with the name of its node, which
# the downward API puts in NODE_NAME. Each region has one node, so the
# answer says which cluster served the call.
apiVersion: v1
kind: Namespace
metadata:
  name: regions
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-region
  namespace: regions
spec:
  replicas: 1
  selector:
    matchLabels:
      app: echo-region
  template:
    metadata:
      labels:
        app: echo-region
    spec:
      containers:
        - name: echo
          image: caddy:2.10.0@sha256:133b5eb7ef9d42e34756ba206b06d84f4e3eb308044e268e182c2747083f09de
          command: ["caddy", "respond", "--listen", ":8080", "--body", "greetings from {env.NODE_NAME}"]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 2
---
# lesson: k8s.l4.failover-between-clusters
# The same fixed node port in every region: whatever sits in front reaches
# a region at <its node>:30090.
apiVersion: v1
kind: Service
metadata:
  name: echo-region
  namespace: regions
spec:
  type: NodePort
  selector:
    app: echo-region
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30090
