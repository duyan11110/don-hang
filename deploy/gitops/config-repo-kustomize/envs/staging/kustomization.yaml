# lesson: k8s.l2.kustomize-overlays
# Staging: the base, plus what only staging has. Its SealedSecrets are
# sealed with staging's key by scripts/devops/seal-secrets.sh, beside this
# file in the config repository (never in Đơn Hàng's own repository).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - sealed-db.yaml
  - sealed-api.yaml
  - sealed-keycloak.yaml
  - sealed-rabbitmq.yaml
  - sealed-notifications.yaml
  - sealed-payments.yaml
  - sealed-fake-gateway.yaml
# lesson: k8s.l2.kustomize-overlays
# lesson: k8s.l3.admission-policies
# The image of each of Đơn Hàng's services and migrations, wherever it
# appears in the base: a tag, and the digest that tag named when it was
# verified. The node pulls by digest, so a tag moved later changes nothing.
images:
  - name: ghcr.io/duyan11110/donhang-api
    newTag: sha-25158b4d4f7cb9a5c0b944f5ea8482221a24b4be
    digest: sha256:4f05067078ab4e6bca443a2af2cd6e5c01324a332423ad9350068be0135ea83d
  - name: ghcr.io/duyan11110/donhang-migrate
