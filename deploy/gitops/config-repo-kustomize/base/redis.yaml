# lesson: k8s.l2.database-in-the-cluster
# Redis stays a Deployment without a claim, as in deploy/k8s/redis.yaml:
# everything in it is a copy of what PostgreSQL holds, so losing it loses
# nothing that cannot be read again.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: donhang
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8.10.2-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: donhang
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
