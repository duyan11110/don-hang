# lesson: devops.l4.blue-green-deployment
# Green: a second full set of the api's Pods beside blue, the Deployment
# api. As many replicas as api has on staging, the same ConfigMap, Secret,
# probes and security context. Its label is app: api-green, so neither
# Deployment's selector picks the other's Pods, and only the Service
# api-green sends to them. scripts/devops/blue-green.sh copies this file
# into envs/staging of the config repository; the overlay's images field
# gives it the tag and digest, as it does for api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-green
  namespace: donhang
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-green
  template:
    metadata:
      labels:
        app: api-green
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: ghcr.io/duyan11110/donhang-api
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api
          env:
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  name: api
                  key: ConnectionStrings__Default
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: api
                  key: RabbitMq__Password
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
# lesson: devops.l4.blue-green-deployment
# The Service an HTTPRoute can name to send requests to green.
apiVersion: v1
kind: Service
metadata:
  name: api-green
  namespace: donhang
spec:
  selector:
    app: api-green
  ports:
    - port: 8080
      targetPort: 8080
