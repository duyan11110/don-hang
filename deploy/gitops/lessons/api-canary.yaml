# lesson: devops.l4.canary-release
# The canary: one Pod of the api beside the Deployment api, labelled
# app: api-canary so that api's selector does not take it and Prometheus
# counts its requests apart. The same ConfigMap, Secret, probes and
# security context as api. scripts/devops/canary.sh and canary-steps.sh
# copy this file into envs/staging of the config repository; the overlay's
# images field gives it the tag and digest, as it does for api.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-canary
  namespace: donhang
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-canary
  template:
    metadata:
      labels:
        app: api-canary
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: ghcr.io/duyan11110/donhang-api
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api
          env:
            - name: ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  name: api
                  key: ConnectionStrings__Default
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: api
                  key: RabbitMq__Password
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
# lesson: devops.l4.canary-release
# The Service the HTTPRoute api names beside api, with a weight each.
apiVersion: v1
kind: Service
metadata:
  name: api-canary
  namespace: donhang
spec:
  selector:
    app: api-canary
  ports:
    - port: 8080
      targetPort: 8080
