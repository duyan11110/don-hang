# lesson: k8s.l3.custom-resources
# A new kind of object for the API server: BackupPolicy, in the API group
# donhang.example, version v1alpha1, one per namespace. The OpenAPI schema
# says which fields an object may have and of which type; the API server
# rejects any object that breaks it.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backuppolicies.donhang.example
spec:
  group: donhang.example
  scope: Namespaced
  names:
    kind: BackupPolicy
    plural: backuppolicies
    singular: backuppolicy
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            # lesson: k8s.l3.custom-resources
            # What a BackupPolicy says: which claim, when (cron syntax) and
            # how many days to keep each copy.
            spec:
              type: object
              required: ["claimName", "schedule", "retentionDays"]
              properties:
                claimName:
                  type: string
                schedule:
                  type: string
                retentionDays:
                  type: integer
                  minimum: 1
