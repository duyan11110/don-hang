# lesson: k8s.l3.cni-plugins
# The cluster donhang-nocni that scripts/k8s/cni-off.sh creates and deletes:
# one control-plane node and one worker, and no network plugin, because
# disableDefaultCNI tells kind not to install kindnet. Same node image as
# kind-config.yaml.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
nodes:
  - role: control-plane
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
  - role: worker
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
