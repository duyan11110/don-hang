# Redis from the image Compose uses, one replica, no persistence: everything
# in it is a copy of what PostgreSQL holds. The api finds it as redis:6379.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: donhang
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8.10.2-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: donhang
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
