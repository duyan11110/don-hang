# lesson: backend.l3.traces-and-spans
# Tempo as one process that keeps traces on its own disk (the tempo-data
# volume): enough for one lab, not for production. It receives spans over
# OTLP from Alloy and answers queries on port 3200.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Keep traces for one day.
compactor:
  compaction:
    block_retention: 24h

usage_report:
  reporting_enabled: false
