# lesson: devops.l2.prometheus-scraping
# Every scrape_interval, Prometheus sends GET /metrics to each target below
# and stores the numbers it gets back with the time of the scrape. One job,
# api: the api's name and port on the donhang network.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8080"]

  # lesson: backend.l3.queue-backlog-metrics
  # From stage-3, RabbitMQ's own numbers, from its Prometheus plugin on port
  # 15692. Its /metrics adds all queues together; /metrics/detailed with the
  # queue_coarse_metrics family gives one series per queue, such as
  #   rabbitmq_detailed_queue_messages_ready{queue="notifications.order-events"}
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs:
      - targets: ["rabbitmq:15692"]
