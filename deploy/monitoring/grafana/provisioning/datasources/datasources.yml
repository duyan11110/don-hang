# lesson: devops.l2.grafana-dashboards
# Grafana reads this file when it starts: the places its panels send queries
# to. It stores no metrics or logs of its own.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  # lesson: devops.l2.centralized-logs
  # Loki has no page of its own in the lab: you query it here, in Grafana.
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100

  # lesson: backend.l3.traces-and-spans
  # From stage-3, the third data source: Tempo, for traces. Explore → Tempo
  # finds a trace by its id and draws its spans as a tree on a timeline.
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
