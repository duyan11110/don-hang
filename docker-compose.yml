# The Đơn Hàng lab at tag stage-0: a static site, a database, and a Linux box
# you can open a shell on. You never run this file by hand; scripts/up.sh does.
name: donhang

services:
  # The lab box. Every script in scripts/ runs here, so every lesson sees the
  # same Linux, the same tools and the same output on every machine.
  lab:
    build: ./lab
    image: donhang-lab:stage-0
    container_name: donhang-lab
    hostname: donhang-lab
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Asia/Ho_Chi_Minh"
      USER_NAME: "dev"
      PUBLIC_KEY_FILE: "/keys/lab_key.pub"
      SUDO_ACCESS: "false"
      PASSWORD_ACCESS: "false"
      LISTEN_PORT: "2222"
      PGPASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - ./:/repo:ro
      - ./secrets:/keys
      - lab-config:/config
    extra_hosts:
      - "donhang.local:127.0.0.1"
    # Drop whatever search domain the host has, so that looking up "db" asks
    # for "db" and not for "db.something.your-company.example".
    dns_search:
      - "."
    ports:
      # 2222 is this box's SSH server; 8080 and 8443 belong to the web service,
      # which shares this box's network so that localhost means the same thing
      # in every lesson. 8180 is Keycloak, which the web service proxies.
      - "2222:2222"
      - "8080:8080"
      - "8443:8443"
      - "8180:8180"
    networks:
      donhang:
        ipv4_address: 172.28.0.12

  web:
    image: caddy:2.10.0
    container_name: donhang-web
    network_mode: "service:lab"
    depends_on:
      - lab
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/srv/www:ro
      - caddy-data:/data
      - caddy-config:/config

  db:
    image: postgres:17.6-alpine
    container_name: donhang-db
    hostname: db
    environment:
      POSTGRES_DB: donhang
      POSTGRES_USER: donhang
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      TZ: "Asia/Ho_Chi_Minh"
      PGTZ: "Asia/Ho_Chi_Minh"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/20-seed.sql:ro
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      donhang:
        ipv4_address: 172.28.0.11
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donhang -d donhang"]
      interval: 3s
      timeout: 3s
      retries: 30

  # lesson: devops.l1.compose-for-the-api
  api:
    build:
      context: .
      dockerfile: DonHang.Api/Dockerfile
    image: donhang-api:stage-1
    container_name: donhang-api
    hostname: api
    environment:
      # lesson: devops.l1.config-and-env
      ConnectionStrings__Default: "Host=db;Database=donhang;Username=donhang;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"
      # lesson: backend.l2.database-job-queue
      # Where NotificationSender's emails go: the mailpit service below.
      Smtp__Host: "mailpit"
      Smtp__Port: "1025"
      ASPNETCORE_ENVIRONMENT: "Development"
      # lesson: backend.l2.validating-provider-tokens
      # Tokens name http://localhost:8180/realms/donhang as their issuer, the
      # one address browsers and the lab box use. Inside this container
      # localhost is the api itself, so the keys are fetched from keycloak:8080.
      Keycloak__Authority: "http://localhost:8180/realms/donhang"
      Keycloak__MetadataAddress: "http://keycloak:8080/realms/donhang/.well-known/openid-configuration"
      # lesson: backend.l2.efcore-generated-sql
      # appsettings.json keeps Microsoft.EntityFrameworkCore at Warning; the lab
      # raises only the category that logs each SQL command EF Core sends.
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: "Information"
    depends_on:
      db:
        condition: service_healthy
      # Started first, not waited for: the api answers from PostgreSQL
      # whenever Redis is not there.
      redis:
        condition: service_started
    networks:
      donhang:
        ipv4_address: 172.28.0.13

  # lesson: backend.l2.redis-key-value-store
  # A key-value store the api reaches as redis:6379 on the donhang network.
  # No port is published: only the api and the lab box talk to it, and
  # nothing in it is the only copy of a fact (PostgreSQL has them all).
  redis:
    image: redis:8.10.2-alpine
    container_name: donhang-redis
    hostname: redis
    networks:
      donhang:
        ipv4_address: 172.28.0.15
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # lesson: backend.l2.database-job-queue
  # A fake mail server: it accepts every email the api sends over SMTP
  # (mailpit:1025) and delivers none. Its web page and HTTP API, on port
  # 8025, show what arrived: http://localhost:8025 from this machine.
  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: donhang-mailpit
    hostname: mailpit
    ports:
      - "8025:8025"
    networks:
      donhang:
        ipv4_address: 172.28.0.16

  # lesson: backend.l2.oauth2-roles
  # The authorization server: customers and staff type their passwords here,
  # never into DonHang.App or DonHang.Api. start-dev keeps its data inside the
  # container and imports the realm file below the first time it starts.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: donhang-keycloak
    hostname: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      # Every URL Keycloak hands out, and the issuer in every token, uses
      # this one address, however the request reached it.
      KC_HOSTNAME: "http://localhost:8180"
      # ...except the endpoints a server calls directly (keys, token): asked
      # as keycloak:8080 by the api, Keycloak answers with keycloak:8080 URLs.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/donhang-realm.json:/opt/keycloak/data/import/donhang-realm.json:ro
    networks:
      donhang:
        ipv4_address: 172.28.0.20
    healthcheck:
      # The image has no curl; bash can still send one HTTP request.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 60

  # lesson: frontend.l1.the-widget-tree
  # Serves the Flutter web build (`flutter build web`, run by scripts/up.sh)
  # as plain static files — no Dart runs inside this container.
  app-web:
    image: caddy:2.10.0
    container_name: donhang-app-web
    hostname: app-web
    command: caddy file-server --root /srv/app --listen :8081
    volumes:
      - ./DonHang.App/build/web:/srv/app:ro
    ports:
      - "8081:8081"
    networks:
      donhang:
        ipv4_address: 172.28.0.14

networks:
  donhang:
    name: donhang
    ipam:
      config:
        # Fixed addresses so that the DNS and networking lessons print the same
        # numbers on every machine.
        - subnet: 172.28.0.0/24

volumes:
  db-data:
  caddy-data:
  caddy-config:
  lab-config:
