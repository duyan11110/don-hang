# The Đơn Hàng lab at tag stage-0: a static site, a database, and a Linux box
# you can open a shell on. You never run this file by hand; scripts/up.sh does.
name: donhang

services:
  # The lab box. Every script in scripts/ runs here, so every lesson sees the
  # same Linux, the same tools and the same output on every machine.
  lab:
    build: ./lab
    image: donhang-lab:stage-0
    container_name: donhang-lab
    hostname: donhang-lab
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Asia/Ho_Chi_Minh"
      USER_NAME: "dev"
      PUBLIC_KEY_FILE: "/keys/lab_key.pub"
      SUDO_ACCESS: "false"
      PASSWORD_ACCESS: "false"
      LISTEN_PORT: "2222"
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      # From stage-3: what the messaging scripts use to sign in to
      # RabbitMQ's management API (rabbitmq:15672) as user donhang.
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
    volumes:
      - ./:/repo:ro
      - ./secrets:/keys
      - lab-config:/config
    extra_hosts:
      - "donhang.local:127.0.0.1"
    # Drop whatever search domain the host has, so that looking up "db" asks
    # for "db" and not for "db.something.your-company.example".
    dns_search:
      - "."
    ports:
      # 2222 is this box's SSH server; 8080 and 8443 belong to the web service,
      # which shares this box's network so that localhost means the same thing
      # in every lesson. 8180 is Keycloak, which the web service proxies.
      - "2222:2222"
      - "8080:8080"
      - "8443:8443"
      - "8180:8180"
    networks:
      donhang:
        ipv4_address: 172.28.0.12

  web:
    image: caddy:2.10.0
    container_name: donhang-web
    network_mode: "service:lab"
    depends_on:
      - lab
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/srv/www:ro
      - caddy-data:/data
      - caddy-config:/config

  db:
    image: postgres:17.6-alpine
    container_name: donhang-db
    hostname: db
    environment:
      POSTGRES_DB: donhang
      POSTGRES_USER: donhang
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      TZ: "Asia/Ho_Chi_Minh"
      PGTZ: "Asia/Ho_Chi_Minh"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/20-seed.sql:ro
      - ./db/migrations-baseline.sql:/docker-entrypoint-initdb.d/30-migrations-baseline.sql:ro
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      donhang:
        ipv4_address: 172.28.0.11
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donhang -d donhang"]
      interval: 3s
      timeout: 3s
      retries: 30

  # lesson: devops.l2.migrations-in-the-pipeline
  # Runs the migration bundle against db once, then exits. Exit code 0 means
  # every migration is applied; anything else stops api from starting.
  migrate:
    build:
      context: .
      dockerfile: DonHang.Api/Dockerfile
      target: migrate
    image: donhang-migrate:stage-2
    container_name: donhang-migrate
    command: ["--connection", "Host=db;Database=donhang;Username=donhang;Password=${POSTGRES_PASSWORD}"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      donhang:
        ipv4_address: 172.28.0.17

  # lesson: devops.l1.compose-for-the-api
  api:
    build:
      context: .
      dockerfile: DonHang.Api/Dockerfile
    image: donhang-api:stage-2
    container_name: donhang-api
    hostname: api
    environment:
      # lesson: devops.l1.config-and-env
      ConnectionStrings__Default: "Host=db;Database=donhang;Username=donhang;Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"
      # lesson: backend.l3.message-broker
      # From stage-3 the api sends no email (notifications does, below): it
      # publishes messages to RabbitMQ through its outbox.
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Password: "${RABBITMQ_PASSWORD}"
      ASPNETCORE_ENVIRONMENT: "Development"
      # lesson: backend.l2.validating-provider-tokens
      # Tokens name http://localhost:8180/realms/donhang as their issuer, the
      # one address browsers and the lab box use. Inside this container
      # localhost is the api itself, so the keys are fetched from keycloak:8080.
      Keycloak__Authority: "http://localhost:8180/realms/donhang"
      Keycloak__MetadataAddress: "http://keycloak:8080/realms/donhang/.well-known/openid-configuration"
      # lesson: backend.l2.efcore-generated-sql
      # appsettings.json keeps Microsoft.EntityFrameworkCore at Warning; the lab
      # raises only the category that logs each SQL command EF Core sends.
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: "Information"
      # lesson: devops.l2.json-logs
      # The console logger writes each log event as one JSON object per line.
      # Only this setting changed, no log call in the code; without it the
      # same build prints the usual readable lines (as `dotnet run` does).
      Logging__Console__FormatterName: "json"
    depends_on:
      db:
        condition: service_healthy
      # lesson: devops.l2.migrations-in-the-pipeline
      # Not before migrate has exited successfully: never on an old schema.
      migrate:
        condition: service_completed_successfully
      # Started first, not waited for: the api answers from PostgreSQL
      # whenever Redis is not there.
      redis:
        condition: service_started
      # The same for RabbitMQ: while it is down, orders are still accepted
      # and their messages wait in outbox_messages.
      rabbitmq:
        condition: service_started
    # Healthy once /health/ready answers, so `docker compose up --wait` (and
    # scripts/up.sh) returns only when Caddy can reach the api, not before.
    healthcheck:
      # The image has no curl, and its sh is not bash; bash can still send
      # one HTTP request.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q Healthy <&3"]
      interval: 3s
      timeout: 3s
      retries: 60
    networks:
      donhang:
        ipv4_address: 172.28.0.13

  # lesson: backend.l2.redis-key-value-store
  # A key-value store the api reaches as redis:6379 on the donhang network.
  # No port is published: only the api and the lab box talk to it, and
  # nothing in it is the only copy of a fact (PostgreSQL has them all).
  redis:
    image: redis:8.10.2-alpine
    container_name: donhang-redis
    hostname: redis
    networks:
      donhang:
        ipv4_address: 172.28.0.15
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # lesson: backend.l2.database-job-queue
  # A fake mail server: it accepts every email the api sends over SMTP
  # (mailpit:1025) and delivers none. Its web page and HTTP API, on port
  # 8025, show what arrived: http://localhost:8025 from this machine.
  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: donhang-mailpit
    hostname: mailpit
    ports:
      - "8025:8025"
    networks:
      donhang:
        ipv4_address: 172.28.0.16

  # lesson: backend.l3.message-broker
  # The message broker, from stage-3. The api publishes to it; Notifications
  # and Payments consume from it, so none of them needs another to be up.
  # Its data lives in a volume, so durable queues and persistent messages
  # survive `docker compose restart rabbitmq`. The management page, at
  # http://localhost:15672 (user donhang, RABBITMQ_PASSWORD in .env), shows
  # the exchanges, queues and messages.
  rabbitmq:
    image: rabbitmq:4.1.8-management-alpine
    container_name: donhang-rabbitmq
    # RabbitMQ names its node, and its data directory, after the hostname.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "donhang"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "15672:15672"
    networks:
      donhang:
        ipv4_address: 172.28.0.18
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

  # lesson: backend.l3.message-broker
  # The Notifications service and the job that migrates its own database,
  # donhang_notifications, on the same PostgreSQL server as donhang; the
  # migration bundle creates the database the first time it runs.
  notifications-migrate:
    build:
      context: .
      dockerfile: DonHang.Notifications/Dockerfile
      target: migrate
    image: donhang-notifications-migrate:stage-3
    container_name: donhang-notifications-migrate
    command: ["--connection", "Host=db;Database=donhang_notifications;Username=donhang;Password=${POSTGRES_PASSWORD}"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      donhang:
        ipv4_address: 172.28.0.25

  notifications:
    build:
      context: .
      dockerfile: DonHang.Notifications/Dockerfile
    image: donhang-notifications:stage-3
    container_name: donhang-notifications
    hostname: notifications
    environment:
      ConnectionStrings__Default: "Host=db;Database=donhang_notifications;Username=donhang;Password=${POSTGRES_PASSWORD}"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Password: "${RABBITMQ_PASSWORD}"
      # Where NotificationSender's emails go: the mailpit service below.
      Smtp__Host: "mailpit"
      Smtp__Port: "1025"
      Logging__Console__FormatterName: "json"
    depends_on:
      notifications-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q Healthy <&3"]
      interval: 3s
      timeout: 3s
      retries: 60
    networks:
      donhang:
        ipv4_address: 172.28.0.19

  # lesson: backend.l3.payments-service
  # The Payments service, its migration job (database donhang_payments), and
  # the fake payment gateway it calls. Only payments gets GATEWAY_API_KEY.
  payments-migrate:
    build:
      context: .
      dockerfile: DonHang.Payments/Dockerfile
      target: migrate
    image: donhang-payments-migrate:stage-3
    container_name: donhang-payments-migrate
    command: ["--connection", "Host=db;Database=donhang_payments;Username=donhang;Password=${POSTGRES_PASSWORD}"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      donhang:
        ipv4_address: 172.28.0.26

  payments:
    build:
      context: .
      dockerfile: DonHang.Payments/Dockerfile
    image: donhang-payments:stage-3
    container_name: donhang-payments
    hostname: payments
    environment:
      ConnectionStrings__Default: "Host=db;Database=donhang_payments;Username=donhang;Password=${POSTGRES_PASSWORD}"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Password: "${RABBITMQ_PASSWORD}"
      Gateway__BaseAddress: "http://fake-gateway:8080/"
      Gateway__ApiKey: "${GATEWAY_API_KEY}"
      # refund-design.md waits 1 minute, then 2, 4... up to 1 hour between
      # tries; the lab waits seconds, so the scripts finish in a minute.
      Refunds__FirstRetryDelay: "00:00:02"
      Refunds__MaxRetryDelay: "00:00:10"
      # lesson: backend.l3.resilience-pipeline
      # The gateway pipeline's timeout is 10 s and an open circuit waits 30 s
      # (GatewaySettings); the lab makes both short for the same reason.
      Gateway__Timeout: "00:00:03"
      Gateway__BreakDuration: "00:00:10"
      Keycloak__Authority: "http://localhost:8180/realms/donhang"
      Keycloak__MetadataAddress: "http://keycloak:8080/realms/donhang/.well-known/openid-configuration"
      Logging__Console__FormatterName: "json"
    depends_on:
      payments-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      fake-gateway:
        condition: service_started
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q Healthy <&3"]
      interval: 3s
      timeout: 3s
      retries: 60
    networks:
      donhang:
        ipv4_address: 172.28.0.27

  fake-gateway:
    build:
      context: .
      dockerfile: fake-gateway/Dockerfile
    image: donhang-fake-gateway:stage-3
    container_name: donhang-fake-gateway
    hostname: fake-gateway
    environment:
      Gateway__ApiKey: "${GATEWAY_API_KEY}"
      Logging__Console__FormatterName: "json"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ok <&3"]
      interval: 3s
      timeout: 3s
      retries: 60
    networks:
      donhang:
        ipv4_address: 172.28.0.28

  # lesson: backend.l2.oauth2-roles
  # The authorization server: customers and staff type their passwords here,
  # never into DonHang.App or DonHang.Api. start-dev keeps its data inside the
  # container and imports the realm file below the first time it starts.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: donhang-keycloak
    hostname: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
      # Every URL Keycloak hands out, and the issuer in every token, uses
      # this one address, however the request reached it.
      KC_HOSTNAME: "http://localhost:8180"
      # ...except the endpoints a server calls directly (keys, token): asked
      # as keycloak:8080 by the api, Keycloak answers with keycloak:8080 URLs.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/donhang-realm.json:/opt/keycloak/data/import/donhang-realm.json:ro
    networks:
      donhang:
        ipv4_address: 172.28.0.20
    healthcheck:
      # The image has no curl; bash can still send one HTTP request.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 60

  # lesson: frontend.l1.the-widget-tree
  # Serves the Flutter web build (`flutter build web`, run by scripts/up.sh)
  # as plain static files — no Dart runs inside this container.
  app-web:
    image: caddy:2.10.0
    container_name: donhang-app-web
    hostname: app-web
    # From stage-2 a Caddyfile of its own: every path that is not a file
    # answers with index.html, so /products/3 can be opened directly.
    volumes:
      - ./deploy/app-web/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./DonHang.App/build/web:/srv/app:ro
    ports:
      - "8081:8081"
    networks:
      donhang:
        ipv4_address: 172.28.0.14

  # lesson: devops.l2.prometheus-scraping
  # The monitoring services carry `profiles: [monitoring]`: a plain
  # `docker compose up` leaves them out, and
  #   docker compose --profile monitoring up -d
  # starts them too. Prometheus scrapes api:8080/metrics (see its config).
  prometheus:
    image: prom/prometheus:v3.5.5
    container_name: donhang-prometheus
    hostname: prometheus
    profiles: [monitoring]
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      donhang:
        ipv4_address: 172.28.0.21

  # lesson: devops.l2.grafana-dashboards
  # Draws what it asks Prometheus and Loki for; stores no metrics itself. Its
  # data sources and the dashboard are files under deploy/monitoring/grafana.
  # Sign in at http://localhost:3000 as admin, GRAFANA_ADMIN_PASSWORD in .env.
  grafana:
    image: grafana/grafana:12.4.11
    container_name: donhang-grafana
    hostname: grafana
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      donhang:
        ipv4_address: 172.28.0.22

  # lesson: devops.l2.centralized-logs
  # Loki stores the log lines of every container; no port is published, you
  # query it from Grafana. Alloy reads each container's output through the
  # Docker socket (read-only) and sends every line to Loki.
  loki:
    image: grafana/loki:3.5.12
    container_name: donhang-loki
    hostname: loki
    profiles: [monitoring]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./deploy/monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks:
      donhang:
        ipv4_address: 172.28.0.23

  alloy:
    image: grafana/alloy:v1.20.0
    container_name: donhang-alloy
    hostname: alloy
    profiles: [monitoring]
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy/data"]
    volumes:
      - ./deploy/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      donhang:
        ipv4_address: 172.28.0.24

networks:
  donhang:
    name: donhang
    ipam:
      config:
        # Fixed addresses so that the DNS and networking lessons print the same
        # numbers on every machine.
        - subnet: 172.28.0.0/24

volumes:
  db-data:
  rabbitmq-data:
  caddy-data:
  caddy-config:
  lab-config:
  loki-data:
